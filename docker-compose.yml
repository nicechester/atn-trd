services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.local
    ports:
      - "5173:8080"
    env_file:
      - .env
    environment:
      NODE_ENV: development
      ATN_DATA_DIR: /data
      ATN_ENC_KEY: ${ATN_ENC_KEY}
      FINNHUB_API_KEY: ${FINNHUB_API_KEY}
      FRED_API_KEY: ${FRED_API_KEY}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_API_URL: ${LLM_API_URL}
      LLM_MODEL: ${LLM_MODEL}
    volumes:
      - ./data:/data
    restart: unless-stopped
