services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.local
    ports:
      - "5173:8080"
    env_file:
      - .env
    environment:
      NODE_ENV: development
      ATN_DATA_DIR: /data
      FINBERT_MODEL_PATH: /models
    volumes:
      - ./data:/data
      - ./models:/models:ro
    restart: unless-stopped
