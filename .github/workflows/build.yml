name: Build and Deploy

on:
  push:
    branches: [main]

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check for code changes
        id: changes
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD)
          echo "Changed files:"
          echo "$CHANGED"
          
          if echo "$CHANGED" | grep -qvE '^(docs/|README\.md|.*\.md$)'; then
            echo "code_changed=true" >> $GITHUB_OUTPUT
          else
            echo "code_changed=false" >> $GITHUB_OUTPUT
            echo "Only docs changed, skipping build/deploy"
          fi

      - name: Setup Node.js
        if: steps.changes.outputs.code_changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        if: steps.changes.outputs.code_changed == 'true'
        run: npm install

      - name: Build
        if: steps.changes.outputs.code_changed == 'true'
        run: npm run build

      - name: Create deployment tarball
        if: steps.changes.outputs.code_changed == 'true'
        run: |
          rm -rf node_modules
          npm install --omit=dev
          tar -czf atn-trd.tar.gz \
            node_modules \
            server/dist \
            server/public \
            shared/dist \
            web/dist \
            package.json \
            package-lock.json

      - name: Authenticate to GCP
        if: steps.changes.outputs.code_changed == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud
        if: steps.changes.outputs.code_changed == 'true'
        uses: google-github-actions/setup-gcloud@v2

      - name: Upload tarball to GCS
        if: steps.changes.outputs.code_changed == 'true'
        run: gsutil cp atn-trd.tar.gz gs://atn-trd-backups/deploy/atn-trd.tar.gz

      - name: Get VM IP
        if: steps.changes.outputs.code_changed == 'true'
        id: vm-ip
        run: |
          VM_IP=$(gcloud compute instances describe atn-trd-vm --zone=us-central1-a --format='get(networkInterfaces[0].accessConfigs[0].natIP)')
          echo "ip=$VM_IP" >> $GITHUB_OUTPUT

      - name: Stop service on VM
        if: steps.changes.outputs.code_changed == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ steps.vm-ip.outputs.ip }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            sudo systemctl stop atn-trd || true

      - name: Download tarball on VM
        if: steps.changes.outputs.code_changed == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ steps.vm-ip.outputs.ip }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          command_timeout: 5m
          script: |
            gsutil cp gs://atn-trd-backups/deploy/atn-trd.tar.gz ~/

      - name: Extract tarball on VM
        if: steps.changes.outputs.code_changed == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ steps.vm-ip.outputs.ip }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          command_timeout: 5m
          script: |
            rm -rf ~/atn-trd/node_modules ~/atn-trd/server/dist ~/atn-trd/shared/dist ~/atn-trd/web/dist
            tar -xzf ~/atn-trd.tar.gz -C ~/atn-trd
            rm ~/atn-trd.tar.gz

      - name: Start service on VM
        if: steps.changes.outputs.code_changed == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ steps.vm-ip.outputs.ip }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            sudo systemctl start atn-trd

      - name: Wait for FinBERT ready
        if: steps.changes.outputs.code_changed == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ steps.vm-ip.outputs.ip }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          command_timeout: 10m
          script: |
            for i in $(seq 1 120); do
              if journalctl -u atn-trd --since '5 minutes ago' | grep -q "FinBERT model ready"; then
                echo "FinBERT is ready!"
                exit 0
              fi
              sleep 5
            done
            echo "FinBERT readiness check timed out"
            exit 1
