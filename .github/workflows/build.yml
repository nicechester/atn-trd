name: Build and Deploy

on:
  push:
    branches: [main]

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Required for WIF
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check for code changes
        id: changes
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD)
          echo "Changed files:"
          echo "$CHANGED"
          
          if echo "$CHANGED" | grep -qvE '^(docs/|README\.md|.*\.md$)'; then
            echo "code_changed=true" >> $GITHUB_OUTPUT
          else
            echo "code_changed=false" >> $GITHUB_OUTPUT
            echo "Only docs changed, skipping build/deploy"
          fi

      - name: Setup Node.js
        if: steps.changes.outputs.code_changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        if: steps.changes.outputs.code_changed == 'true'
        run: npm install

      - name: Build
        if: steps.changes.outputs.code_changed == 'true'
        run: npm run build

      - name: Create deployment tarball
        if: steps.changes.outputs.code_changed == 'true'
        run: |
          rm -rf node_modules
          npm install --omit=dev
          tar -czf atn-trd.tar.gz \
            node_modules \
            server/dist \
            server/public \
            shared/dist \
            web/dist \
            package.json \
            package-lock.json

      - name: Authenticate to GCP
        if: steps.changes.outputs.code_changed == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        if: steps.changes.outputs.code_changed == 'true'
        uses: google-github-actions/setup-gcloud@v2

      - name: Upload tarball to GCS
        if: steps.changes.outputs.code_changed == 'true'
        run: gsutil cp atn-trd.tar.gz gs://atn-trd-backups/deploy/atn-trd.tar.gz

      - name: Stop service on VM
        if: steps.changes.outputs.code_changed == 'true'
        run: |
          gcloud compute ssh atn-trd-vm --zone=us-central1-a --command="sudo systemctl stop atn-trd"

      - name: Download tarball on VM
        if: steps.changes.outputs.code_changed == 'true'
        run: |
          gcloud compute ssh atn-trd-vm --zone=us-central1-a --command="cd ~ && gsutil cp gs://atn-trd-backups/deploy/atn-trd.tar.gz ."

      - name: Extract tarball on VM
        if: steps.changes.outputs.code_changed == 'true'
        run: |
          gcloud compute ssh atn-trd-vm --zone=us-central1-a --command="cd ~ && rm -rf atn-trd/node_modules atn-trd/server/dist atn-trd/shared/dist atn-trd/web/dist && tar -xzf atn-trd.tar.gz -C atn-trd && rm atn-trd.tar.gz"

      - name: Start service on VM
        if: steps.changes.outputs.code_changed == 'true'
        run: |
          gcloud compute ssh atn-trd-vm --zone=us-central1-a --command="sudo systemctl start atn-trd"

      - name: Wait for FinBERT ready
        if: steps.changes.outputs.code_changed == 'true'
        run: |
          echo "Waiting for FinBERT model to load..."
          for i in $(seq 1 120); do
            if gcloud compute ssh atn-trd-vm --zone=us-central1-a --command="journalctl -u atn-trd --since '5 minutes ago'" 2>/dev/null | grep -q "FinBERT model ready"; then
              echo "FinBERT is ready!"
              exit 0
            fi
            sleep 5
          done
          echo "FinBERT readiness check timed out"
          exit 1
