name: Build and Deploy

on:
  push:
    branches: [main]

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: |
          npm run build
          mkdir -p server/public
          cp -r web/dist/* server/public/
          echo "{\"commit\":\"${GITHUB_SHA::7}\",\"buildNumber\":${{ github.run_number }},\"buildTime\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" > server/build-info.json

      - name: Commit dist files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f shared/dist server/public web/dist server/build-info.json
          git diff --staged --quiet || git commit -m "build: update dist files [skip ci]"
          git push

      - name: Deploy to VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd ~/atn-trd
            git pull
            npm install --omit=dev
            sudo systemctl restart atn-trd

      - name: Wait for FinBERT ready
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          command_timeout: 10m
          script: |
            echo "Waiting for FinBERT model to load..."
            for i in $(seq 1 120); do
              if journalctl -u atn-trd --since "5 minutes ago" | grep -q "FinBERT model ready"; then
                echo "FinBERT is ready!"
                exit 0
              fi
              sleep 5
            done
            echo "FinBERT readiness check timed out"
            exit 1
