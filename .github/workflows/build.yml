name: Build and Deploy

on:
  push:
    branches: [main]

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check for code changes
        id: changes
        run: |
          # Get changed files between HEAD and previous commit
          CHANGED=$(git diff --name-only HEAD~1 HEAD)
          echo "Changed files:"
          echo "$CHANGED"
          
          # Check if any non-doc files changed
          if echo "$CHANGED" | grep -qvE '^(docs/|README\.md|.*\.md$)'; then
            echo "code_changed=true" >> $GITHUB_OUTPUT
          else
            echo "code_changed=false" >> $GITHUB_OUTPUT
            echo "Only docs changed, skipping build/deploy"
          fi

      - name: Setup Node.js
        if: steps.changes.outputs.code_changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies and build
        if: steps.changes.outputs.code_changed == 'true'
        run: |
          npm install
          npm run build

      - name: Create deployment tarball
        if: steps.changes.outputs.code_changed == 'true'
        run: |
          # Remove dev dependencies, keep only production
          rm -rf node_modules
          npm install --omit=dev
          
          # Create tarball with only what's needed to run
          tar -czf atn-trd.tar.gz \
            node_modules \
            server/dist \
            server/public \
            shared/dist \
            web/dist \
            package.json \
            package-lock.json

      - name: Upload tarball to GCS
        if: steps.changes.outputs.code_changed == 'true'
        run: |
          echo '${{ secrets.GCP_SA_KEY }}' > /tmp/gcp-key.json
          gcloud auth activate-service-account --key-file=/tmp/gcp-key.json
          gsutil cp atn-trd.tar.gz gs://atn-trd-backups/deploy/atn-trd.tar.gz
          rm /tmp/gcp-key.json

      - name: Deploy on VM
        if: steps.changes.outputs.code_changed == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd ~
            gsutil cp gs://atn-trd-backups/deploy/atn-trd.tar.gz .
            sudo systemctl stop atn-trd
            rm -rf atn-trd/node_modules atn-trd/server/dist atn-trd/shared/dist atn-trd/web/dist
            tar -xzf atn-trd.tar.gz -C atn-trd
            rm atn-trd.tar.gz
            sudo systemctl start atn-trd

      - name: Wait for FinBERT ready
        if: steps.changes.outputs.code_changed == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          command_timeout: 10m
          script: |
            echo "Waiting for FinBERT model to load..."
            for i in $(seq 1 120); do
              if journalctl -u atn-trd --since "5 minutes ago" | grep -q "FinBERT model ready"; then
                echo "FinBERT is ready!"
                exit 0
              fi
              sleep 5
            done
            echo "FinBERT readiness check timed out"
            exit 1
