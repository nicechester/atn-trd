name: Build and Deploy

on:
  push:
    branches: [main]

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: |
          npm run build
          mkdir -p server/public
          cp -r web/dist/* server/public/
          echo "{\"commit\":\"${GITHUB_SHA::7}\",\"buildTime\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" > server/build-info.json

      - name: Commit dist files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f shared/dist server/public web/dist server/build-info.json
          git diff --staged --quiet || git commit -m "build: update dist files [skip ci]"
          git push

      - name: Deploy to VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd ~/atn-trd
            git pull
            npm install --omit=dev
            sudo systemctl restart atn-trd

      - name: Wait for health check
        run: |
          echo "Waiting for server to be ready..."
          for i in {1..60}; do
            if curl -sf http://${{ secrets.VM_HOST }}:8080/api/health > /dev/null; then
              echo "Server is healthy!"
              exit 0
            fi
            sleep 2
          done
          echo "Health check timed out"
          exit 1
