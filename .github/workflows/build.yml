name: Build and Deploy

on:
  push:
    branches: [main]

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check for code changes
        id: changes
        run: |
          # Get changed files between HEAD and previous commit
          CHANGED=$(git diff --name-only HEAD~1 HEAD)
          echo "Changed files:"
          echo "$CHANGED"
          
          # Check if any non-doc files changed
          if echo "$CHANGED" | grep -qvE '^(docs/|README\.md|.*\.md$)'; then
            echo "code_changed=true" >> $GITHUB_OUTPUT
          else
            echo "code_changed=false" >> $GITHUB_OUTPUT
            echo "Only docs changed, skipping build/deploy"
          fi

      - name: Deploy to VM
        if: steps.changes.outputs.code_changed == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd ~/atn-trd
            git pull
            npm install --omit=dev
            sudo systemctl restart atn-trd

      - name: Wait for FinBERT ready
        if: steps.changes.outputs.code_changed == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          command_timeout: 10m
          script: |
            echo "Waiting for FinBERT model to load..."
            for i in $(seq 1 120); do
              if journalctl -u atn-trd --since "5 minutes ago" | grep -q "FinBERT model ready"; then
                echo "FinBERT is ready!"
                exit 0
              fi
              sleep 5
            done
            echo "FinBERT readiness check timed out"
            exit 1
