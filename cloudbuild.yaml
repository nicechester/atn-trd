steps:
  # Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'us-central1-docker.pkg.dev/$PROJECT_ID/atn-trd/app:$SHORT_SHA', '-t', 'us-central1-docker.pkg.dev/$PROJECT_ID/atn-trd/app:latest', '.']

  # Push image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '--all-tags', 'us-central1-docker.pkg.dev/$PROJECT_ID/atn-trd/app']

  # Deploy to VM
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud compute ssh atn-trd-vm --zone=us-central1-a --command='
          docker pull us-central1-docker.pkg.dev/$PROJECT_ID/atn-trd/app:latest
          docker stop atn-trd 2>/dev/null || true
          docker rm atn-trd 2>/dev/null || true
          docker run -d --name atn-trd --restart=unless-stopped \
            -p 3000:3000 \
            -v /mnt/stateful_partition/data:/app/data \
            --env-file /mnt/stateful_partition/.env \
            us-central1-docker.pkg.dev/$PROJECT_ID/atn-trd/app:latest
        '

options:
  logging: CLOUD_LOGGING_ONLY

timeout: '600s'
