steps:
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud compute ssh atn-trd-vm --zone=us-central1-a --tunnel-through-iap --command='
          set -e
          cd ~/atn-trd
          git fetch origin
          git reset --hard origin/main
          npm ci
          npm run build
          sudo systemctl restart atn-trd
        '

options:
  logging: CLOUD_LOGGING_ONLY

timeout: '600s'
